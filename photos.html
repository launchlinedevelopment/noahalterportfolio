<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noah Alter Photos | Portraits & Portfolio</title>
  <meta name="description" content="Photos and professional portraits of Noah Alter, a New Jersey student, entrepreneur, nonprofit founder, student leader, and aspiring accounting major." />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://noahalter.com/photos.html" />
  <meta property="og:type" content="profile" />
  <meta property="og:title" content="Noah Alter Photos" />
  <meta property="og:description" content="Professional portraits and portfolio photos of Noah Alter." />
  <meta property="og:url" content="https://noahalter.com/photos.html" />
  <meta property="og:image" content="https://noahalter.com/assets/photo-7.jpg" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .photo-page{padding:120px 0 90px}
    .photo-page h1{font-family:"DM Serif Display",serif;font-weight:400;font-size:clamp(4rem,8vw,8rem);line-height:.9;margin:18px 0 22px}
    .photo-page .intro{max-width:760px;color:#5d6876;font-size:1.05rem;margin-bottom:52px}
    .portrait-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .portrait-grid figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden}
    .portrait-grid img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
    .portrait-grid figcaption{padding:16px 18px;font-weight:700;font-size:.9rem}
    .photo-back{display:inline-block;margin-top:34px;color:var(--ink);font-weight:800;text-decoration:none}
    @media(max-width:700px){.portrait-grid{grid-template-columns:1fr}.photo-page{padding-top:92px}}
  </style>
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"CollectionPage",
    "name":"Noah Alter Photos",
    "url":"https://noahalter.com/photos.html",
    "about":{
      "@type":"Person",
      "name":"Noah Alter",
      "url":"https://noahalter.com/"
    },
    "primaryImageOfPage":{
      "@type":"ImageObject",
      "contentUrl":"https://noahalter.com/assets/photo-7.jpg",
      "name":"Noah Alter professional portrait",
      "caption":"Professional portrait of Noah Alter."
    }
  }
  </script>
</head>
<body>
  <header class="nav-wrap">
    <nav class="nav shell">
      <a class="brand" href="/">NOAH ALTER</a>
      <div class="nav-links"><a href="/">Portfolio</a></div>
    </nav>
  </header>
  <main class="photo-page shell">
    <p class="eyebrow">NOAH ALTER · PHOTO GALLERY</p>
    <h1>Photos of<br>Noah Alter.</h1>
    <p class="intro">Professional portraits from my portfolio. I’m a New Jersey student focused on accounting, entrepreneurship, leadership, service, and building projects that bring people together.</p>
    <div class="portrait-grid">
      <figure>
        <img src="/assets/photo-7.jpg" alt="Noah Alter professional portrait in a blue suit" loading="eager" />
        <figcaption>Noah Alter — professional portrait</figcaption>
      </figure>
      <figure>
        <img src="/assets/photo-1.jpg" alt="Professional headshot of Noah Alter" loading="eager" />
        <figcaption>Noah Alter — professional headshot</figcaption>
      </figure>
      <figure>
        <img src="/assets/photo-2.jpg" alt="Noah Alter studio portrait" loading="lazy" />
        <figcaption>Noah Alter — studio portrait</figcaption>
      </figure>
      <figure>
        <img src="/assets/photo-8.jpg" alt="Noah Alter outdoor professional portrait" loading="lazy" />
        <figcaption>Noah Alter — outdoor portrait</figcaption>
      </figure>
    </div>
    <a class="photo-back" href="/">← Back to portfolio</a>
  </main>
</body>
</html>
